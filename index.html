<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Search & Discover Pokémon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(10px);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.8rem;
        }
        .search-container {
            margin: 40px 0;
        }
        .search-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .search-box input {
            border: none;
            outline: none;
            font-size: 1.1rem;
        }
        .search-box button {
            border: none;
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .search-box button:hover {
            background: #764ba2;
        }
        .pokemon-card {
            background: white;
            border: none;
            border-radius: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .pokemon-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }
        .pokemon-image {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pokemon-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .pokemon-info {
            padding: 15px;
            text-align: center;
        }
        .pokemon-name {
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
        }
        .pokemon-id {
            color: #667eea;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .type-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 5px 2px;
            color: white;
            font-weight: 600;
        }
        .type-normal { background: #A8A878; }
        .type-fire { background: #F08030; }
        .type-water { background: #6890F0; }
        .type-electric { background: #F8D030; color: #333; }
        .type-grass { background: #78C850; }
        .type-ice { background: #98D8D8; color: #333; }
        .type-fighting { background: #C03028; }
        .type-poison { background: #A040A0; }
        .type-ground { background: #E0C068; color: #333; }
        .type-flying { background: #A890F0; }
        .type-psychic { background: #F85888; }
        .type-bug { background: #A8B820; }
        .type-rock { background: #B8A038; }
        .type-ghost { background: #705898; }
        .type-dragon { background: #7038F8; }
        .type-dark { background: #705848; }
        .type-steel { background: #B8B8D0; }
        .type-fairy { background: #EE99AC; }
        .detail-modal .modal-content {
            border-radius: 20px;
            overflow: hidden;
        }
        .detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .detail-image {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
            text-align: center;
        }
        .detail-image img {
            max-width: 300px;
            object-fit: contain;
        }
        .stat-bar {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .stat-name {
            width: 100px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .stat-value {
            width: 50px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }
        .progress {
            flex: 1;
            margin: 0 10px;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .spinner-border {
            color: white;
        }
        .no-results {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2rem;
        }
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        .pagination-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .pagination-btn:hover {
            background: white;
            transform: scale(1.05);
        }
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fas fa-border-all"></i> Pokédex
            </span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Busca un Pokémon por nombre o ID..." 
                       class="form-control-input w-100">
                <button onclick="searchPokemon()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div class="mb-3">
            <button class="btn btn-light" onclick="loadPokemons(0)">
                <i class="fas fa-list"></i> Ver Todo
            </button>
        </div>

        <div id="loading" class="loading d-none">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <div id="pokemonGrid" class="row g-4">
            <!-- Pokemon cards will be loaded here -->
        </div>

        <div class="pagination-container">
            <button class="pagination-btn" id="prevBtn" onclick="previousPage()" disabled>
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <button class="pagination-btn" id="nextBtn" onclick="nextPage()">
                Siguiente <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade detail-modal" id="pokemonModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="detail-header">
                    <h2 id="modalTitle"></h2>
                    <p id="modalId" class="mb-0"></p>
                </div>
                <div class="detail-image">
                    <img id="modalImage" src="" alt="Pokemon">
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Tipos</h5>
                            <div id="modalTypes"></div>
                            <h5 class="mt-3">Habilidades</h5>
                            <div id="modalAbilities"></div>
                        </div>
                        <div class="col-md-6">
                            <h5>Información Física</h5>
                            <p><strong>Altura:</strong> <span id="modalHeight"></span></p>
                            <p><strong>Peso:</strong> <span id="modalWeight"></span></p>
                        </div>
                    </div>
                    <h5 class="mt-4">Estadísticas Base</h5>
                    <div id="modalStats"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
